<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MYSUN</title>
<meta name="description" content="MYSUN is an AI-powered home operating system that unifies energy, climate, safety and monitoring in one intelligent platform. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141c30;--blue:#2c5bd4;--white:#fff;--soft:#8ea6d8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--white);font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
.wrap{min-height:100vh;max-width:1320px;margin:0 auto;padding:48px 32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:32px;align-items:center}
h1{font-size:clamp(56px,7.5vw,104px);font-weight:800;letter-spacing:-.01em;line-height:1;margin:0 0 20px;padding-bottom:20px;border-bottom:2px solid rgba(255,255,255,.75);display:inline-block}
h2{font-size:clamp(20px,2.3vw,30px);font-weight:700;line-height:1.25;text-transform:uppercase;margin:0 0 12px}
.sub{font-size:clamp(14px,1.4vw,18px);font-weight:600;line-height:1.45;text-transform:uppercase;color:var(--soft);margin:0 0 28px;max-width:34em}
.tags{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:0 0 32px}
.tags li{background:var(--blue);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600}
.soon{display:inline-block;background:var(--white);color:var(--bg);border-radius:999px;padding:12px 28px;font-weight:700;font-size:16px}
.art img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(to right,transparent,#000 8%);mask-image:linear-gradient(to right,transparent,#000 8%)}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:32px 16px}.art{order:2}}
</style>
</head>
<body>
<main class="wrap">
  <section>
    <h1>MYSUN</h1>
    <h2>An AI-powered home operating system</h2>
    <p class="sub">Energy, climate, safety and monitoring in one intelligent platform</p>
    <ul class="tags">
      <li>#SolarOptimization</li><li>#FireIntelligence</li><li>#SmartHomeAI</li>
      <li>#HomeMonitoring</li><li>#ClimateAutomation</li><li>#EnergyControl</li>
    </ul>
    <span class="soon">Coming soon</span>
  </section>
  <div class="art"><img src="devices.jpg" alt="MYSUN app on a laptop and a phone"></div>
</main>
</body>
</html>
